<div class="content-area">
    <div class="page-header">
        <div>
            <h1>Dashboard Overview</h1>
            <p>Bentornato! Ecco il tuo riepilogo fitness</p>
        </div>
    </div>

    <!-- Active Workout Card (Separate Component) -->
    <div class="workout-section">
        <app-active-workout-card (workoutCompleted)="onWorkoutCompleted()"></app-active-workout-card>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3>Allenamenti Settimana</h3>
            <p class="stat-value">{{ weeklyWorkouts }}</p>
        </div>
        <div class="stat-card">
            <h3>Calorie Bruciate</h3>
            <p class="stat-value">{{ caloriesBurned | number }}</p>
        </div>
        <div class="stat-card">
            <h3>Calorie Assunte</h3>
            <p class="stat-value">{{ dailyCaloriesConsumed | number }}</p>
        </div>
    </div>
</div>
