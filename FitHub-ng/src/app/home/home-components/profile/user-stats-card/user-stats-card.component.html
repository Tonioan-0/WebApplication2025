<div class="stats-wrapper">

  <div class="status-section mb-4">
    <label class="section-label">STATO ATTUALE</label>

    <div class="status-bubble">

      <i class="bi bi-quote quote-icon"></i>

      <div class="content-area">
        @if (!isEditing) {
        <span class="status-text text-truncate">
          "{{ statusMessage || 'Nessuno stato inserito...' }}"
        </span>
        } @else {
        <input type="text" class="ghost-input" [(ngModel)]="tempStatus" (keyup.enter)="saveStatus()"
          placeholder="Scrivi qui..." autofocus style="padding-left: 8px;">
        }
      </div>

      @if (isMyProfile) {
      <button class="action-btn" [ngClass]="{'btn-save': isEditing, 'btn-edit': !isEditing}"
        (click)="isEditing ? saveStatus() : enableEdit()" [title]="isEditing ? 'Salva' : 'Modifica'">

        @if (isEditing) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path
            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
        </svg>
        }
      </button>
      }

    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <span class="stat-value text-white">{{ streak }}</span>
      <span class="stat-label text-danger"><i class="bi bi-fire"></i> Streak</span>
    </div>
    <div class="stat-box">
      <span class="stat-value text-white">{{ weeklyWorkouts }}</span>
      <span class="stat-label text-warning"><i class="bi bi-activity"></i> Workout</span>
    </div>
  </div>
</div>
