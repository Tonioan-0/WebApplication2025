<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Bentornato</h2>
            <p>Inserisci i tuoi dati per accedere al tuo account</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nome@fithub.com" [(ngModel)]="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" [(ngModel)]="password" name="password"
                    required>
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox"> Ricordami
                </label>
                <a href="#" class="forgot-link">Password dimenticata?</a>
            </div>

            <button type="submit" class="btn-primary w-100" [disabled]="isLoading">
                {{ isLoading ? 'Accesso in corso...' : 'Accedi' }}
            </button>
        </form>

        <div class="auth-footer">
            <p>Non hai un account? <a routerLink="/register">Registrati</a></p>
        </div>
    </div>

    <!-- Ban Popup for utenti bannati -->
    <app-ban-popup *ngIf="showBanPopup" [reason]="banReason" (close)="closeBanPopup()">
    </app-ban-popup>
</div>
