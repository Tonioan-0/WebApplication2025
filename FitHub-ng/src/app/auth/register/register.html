<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Crea un Account</h2>
            <p>Inizia il tuo percorso fitness oggi</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>
            <div *ngIf="successMessage" class="success-message">
                {{ successMessage }}
            </div>

            <div class="form-group">
                <label for="fullname">Nome Completo</label>
                <input type="text" id="fullname" placeholder="Nome Completo" [(ngModel)]="username" name="username"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="nome@FitHub.com" [(ngModel)]="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" [(ngModel)]="password" name="password"
                    required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Conferma Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••" [(ngModel)]="confirmPassword"
                    name="confirmPassword" required>
            </div>

            <button type="submit" class="btn-primary w-100">Crea Account</button>
        </form>

        <div class="login-link">
            <p>Hai già un account? <a routerLink="/login">Accedi</a></p>
        </div>
    </div>
</div>
