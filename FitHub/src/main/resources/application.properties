# Main Application Configuration
spring.application.name=FitHub-Spring
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fithub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:abacus}
spring.datasource.driver-class-name=org.postgresql.Driver
# Gemini API Configuration - ENABLED in production
gemini.api.enabled=true
gemini.api.key=${GEMINI_API_KEY:dummy}
# Application Configuration
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
server.port=8080
# Session Configuration - Fixes 401 on page refresh
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=24h